name: RiskGPT package

on:
  pull_request:
    paths:
      - 'riskgpt/**'
      - 'supabase/migrations/**'
      - '.github/workflows/riskgpt.yml'
  push:
    branches: [main]
    paths:
      - 'riskgpt/**'
      - 'supabase/migrations/**'
      - '.github/workflows/riskgpt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-riskgpt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: riskgpt/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: riskgpt
      - run: npm run typecheck
        working-directory: riskgpt
      - run: npm test
        working-directory: riskgpt
